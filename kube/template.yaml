# Copy and edit, or use: bash kube/init.sh --name <yourname>
# Placeholders: __NAME__  __KEY__  __SUDO_PASS__  __REPO_DIR__

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sudo-__NAME__-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudo-__NAME__
  labels:
    app: sudo-agent
    agent: __NAME__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sudo-agent
      agent: __NAME__
  template:
    metadata:
      labels:
        app: sudo-agent
        agent: __NAME__
    spec:
      hostNetwork: true
      containers:
      - name: sudo-agent
        image: sudo-agent:latest
        imagePullPolicy: IfNotPresent
        command: ["gateway", "run"]
        securityContext:
          privileged: true
        env:
        - name: DEEPSEEK_API_KEY
          value: "__KEY__"
        - name: SUDO_PASSWORD
          value: "__SUDO_PASS__"
        - name: HERMES_YOLO_MODE
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: config
          mountPath: /opt/data/config.yaml
          subPath: config.yaml
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sudo-__NAME__-data
      - name: config
        hostPath:
          path: __REPO_DIR__/config.yaml
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
